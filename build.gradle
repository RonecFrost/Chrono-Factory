plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version='0.5.1-alpha'
group='com.ronec.chronofactory'
base { archivesName='chronofactory' }
java.toolchain.languageVersion=JavaLanguageVersion.of(21)
neoForge {
    version='21.1.268'
    runs { client { client() }; server { server(); programArgument '--nogui' } }
    mods { chronofactory { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }

tasks.register('transferRegression', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.ronec.chronofactory.TransferAmountsTest'
}
tasks.named('check') { dependsOn tasks.named('transferRegression') }
