name: Build Chrono Factory
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: chrono-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Chrono-Factory-0.6.0-alpha
          path: build/libs/chronofactory-0.6.0-alpha.jar
          if-no-files-found: error
      - name: Publish successful alpha build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.6.0-alpha-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" build/libs/chronofactory-0.6.0-alpha.jar --prerelease --title "Chrono Factory v0.6.0-alpha | Build ${GITHUB_RUN_NUMBER} | $(date -u +%F)" --notes "Experimental NeoForge 1.21.1 build. Test in a disposable world. Compilation does not establish gameplay compatibility."
